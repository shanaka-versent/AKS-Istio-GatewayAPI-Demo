# ArgoCD Application - Sample API v2 (Users API v2)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Only deploy this for Scenario 2 (Parallel Versions)
# For Scenario 1 (Same Backend), this is not needed
#
# Sync Wave 8: v2 Applications after v1
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-v2
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/AKS-Istio-GatewayAPI-Demo.git
    targetRevision: argocd-integration
    path: kubernetes
    directory:
      include: "09-sample-api-v2.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: api-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
