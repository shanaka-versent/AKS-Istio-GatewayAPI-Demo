# ArgoCD Application - Sample API (Users API)
# @author Shanaka Jayasundera - shanakaj@gmail.com
# Sync Wave 7: Applications after Gateway and HTTPRoutes
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/AKS-Istio-GatewayAPI-Demo.git
    targetRevision: argocd-integration  # Automatically follows default branch
    path: kubernetes
    directory:
      include: "08-sample-api.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: api-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
