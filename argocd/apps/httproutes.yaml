# ArgoCD Application - HTTPRoutes
# @author Shanaka Jayasundera - shanakaj@gmail.com
# Sync Wave 6: HTTPRoutes after Gateway and ReferenceGrants
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: httproutes
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/shanaka-aks-poc.git
    targetRevision: HEAD  # Automatically follows default branch
    path: kubernetes
    directory:
      include: "05-httproutes.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # HTTPRoutes are in their respective namespaces (defined in yaml)
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
