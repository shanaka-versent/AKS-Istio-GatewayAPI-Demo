# ArgoCD Application - APIM API Configuration (via ASO)
# @author Shanaka Jayasundera - shanakaj@gmail.com
#
# Sync Wave 9: After services are deployed (wave 7)
# Manages APIM API definitions via Azure Service Operator CRDs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apim-api-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "9"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/AKS-Istio-GatewayAPI-Demo.git
    targetRevision: argocd-integration
    path: kubernetes
    directory:
      include: "10-apim-api-config.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: api-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
