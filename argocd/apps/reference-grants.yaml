# ArgoCD Application - ReferenceGrants
# @author Shanaka Jayasundera - shanakaj@gmail.com
# Sync Wave 6: ReferenceGrants needed before HTTPRoutes can reference cross-namespace backends
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reference-grants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/shanaka-aks-poc.git
    targetRevision: HEAD  # Automatically follows default branch
    path: kubernetes
    directory:
      include: "06-reference-grants.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # ReferenceGrants are created in target namespaces
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
