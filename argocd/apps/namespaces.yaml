# ArgoCD Application - Namespaces
# @author Shanaka Jayasundera - shanakaj@gmail.com
# Sync Wave 1: Namespaces after Istio is ready (for istio labels to work)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/shanaka-versent/shanaka-aks-poc.git
    targetRevision: HEAD  # Automatically follows default branch
    path: kubernetes
    directory:
      include: "00-namespaces.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # Namespaces are cluster-scoped
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
